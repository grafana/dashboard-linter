name: Docker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  docker:
    name: docker
    # GitHub-hosted (not the repo's `x64` label, which resolves to Grafana's
    # self-hosted fleet): PR validation must also run for fork PRs, which
    # cannot use upstream self-hosted runners and would queue forever.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # GoReleaser needs the full history and tags to derive the version.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A snapshot build compiles the binaries and builds the Docker images
      # into the local daemon (per-platform tags, no push) - the documented
      # way to verify a Dockerfile without publishing. --skip=publish would
      # skip the images entirely: with dockers_v2, build and push are a
      # single publish-phase step.
      - name: Build snapshot images
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Smoke test
        run: |
          image="$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '^ghcr.io/grafana/dashboard-linter:.*-amd64$' | head -n 1)"
          if [ -z "$image" ]; then
            echo "no dashboard-linter image was built" >&2
            exit 1
          fi
          echo "Smoke testing ${image}"
          docker run --rm -v "$PWD:/dashboards" "${image}" lint /dashboards/lint/testdata/dashboard.json
          docker run --rm -i -v "$PWD:/dashboards" "${image}" lint --stdin < lint/testdata/dashboard.json
