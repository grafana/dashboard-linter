on:
  pull_request:
  push:
    branches: [main]
name: Test
permissions:
  contents: read

jobs:
  test:
    runs-on: x64
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
    - name: Test
      run: go test ./...
