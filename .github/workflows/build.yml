on:
  pull_request:
  push:
    branches: [main]
name: Build
permissions:
  contents: read

jobs:
  build:
    runs-on: x64
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Build
      run: go build ./
